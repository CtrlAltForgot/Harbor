name: Bug report
description: Report a reproducible Harbor homelab problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please remove pairing codes, passwords, tokens, private tracker URLs, and share names from logs."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and what Harbor did.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Unraid version, Nobara version, Harbor commit/version"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
