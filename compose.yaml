services:
  harbor:
    build: .
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      HARBOR_PAIRING_CODE: ${HARBOR_PAIRING_CODE:?Set HARBOR_PAIRING_CODE in .env}
      HARBOR_ENGINE: qbittorrent
      HARBOR_PORT: 7331
      QBITTORRENT_URL: http://qbittorrent:${QBITTORRENT_WEBUI_PORT:-8080}
      QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME:-admin}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:?Set the qBittorrent Web UI password in .env}
      HARBOR_INCOMPLETE_DIR: /downloads/incomplete
      HARBOR_MEDIA_ROOT: /media
      HARBOR_MEDIA_HOST_PATH: ${MEDIA_ROOT_PATH:-./dev-storage/media}
      HARBOR_MOVIES_DIR: ${HARBOR_MOVIES_DIR:-/media/Movies}
      HARBOR_TV_DIR: ${HARBOR_TV_DIR:-/media/TV Shows}
      HARBOR_REVIEW_DIR: ${HARBOR_REVIEW_DIR:-/media/Needs Review}
    ports:
      - "${HARBOR_HOST_PORT:-7331}:7331"
    volumes:
      - ${HARBOR_CONFIG_PATH:-harbor-config}:/config
      - ${INCOMPLETE_PATH:-./dev-storage/incomplete}:/downloads/incomplete
      - ${COMPLETE_PATH:-./dev-storage/complete}:/downloads/complete
      - ${MEDIA_ROOT_PATH:-./dev-storage/media}:/media
    restart: unless-stopped
    depends_on:
      qbittorrent:
        condition: service_started
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/Chicago}
      WEBUI_PORT: ${QBITTORRENT_WEBUI_PORT:-8080}
      TORRENTING_PORT: ${TORRENTING_PORT:-6881}
    ports:
      - "${QBITTORRENT_WEBUI_PORT:-8080}:${QBITTORRENT_WEBUI_PORT:-8080}"
      - "${TORRENTING_PORT:-6881}:${TORRENTING_PORT:-6881}"
      - "${TORRENTING_PORT:-6881}:${TORRENTING_PORT:-6881}/udp"
    volumes:
      - ${QBITTORRENT_CONFIG_PATH:-qbittorrent-config}:/config
      - ${DOWNLOADS_ROOT:-./dev-storage}:/downloads
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
volumes:
  harbor-config:
  qbittorrent-config:
